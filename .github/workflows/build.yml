name: build

on:
  # Every branch, not just main. Restricting this to main meant a branch could
  # be developed, reviewed and merged without CI ever compiling it once - the
  # first build on a machine that is not the author's happened after the merge,
  # which is the one place a clean-machine failure is expensive.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A push to a branch that also has a pull request open runs this twice. The
# group key covers the ref, so at least a rapid series of pushes cancels its own
# earlier runs rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Windows-only by nature: the whole project is Win32 display APIs.
    # This job exists as much to prove the repository builds on a machine that
    # is not the author's as to catch regressions.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LumenDeck.slnx

      - name: Build
        run: dotnet build LumenDeck.slnx -c Release --no-restore /warnaserror

      - name: Publish self-contained
        run: >
          dotnet publish src/LumenDeck/LumenDeck.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/gui

      - name: Publish CLI self-contained
        run: >
          dotnet publish src/LumenDeck.Cli/LumenDeck.Cli.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/cli

      - name: Smoke test the CLI
        # No monitor answers DDC on a CI runner, so this cannot assert on
        # hardware. What it can prove is that the binary starts, parses
        # arguments and exits cleanly rather than throwing - which is exactly
        # what breaks when a dependency fails to resolve in a clean environment.
        run: |
          ./artifacts/cli/lumendeck-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "lumendeck-cli --help exited $LASTEXITCODE" }
          ./artifacts/cli/lumendeck-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "lumendeck-cli --version exited $LASTEXITCODE" }

      - name: Every version surface agrees
        # This one caught a bug that shipped. Cli.cs lives in LumenDeck.Core, so
        # the version it printed was the engine assembly's, not the command
        # line's - invisible while the two projects happened to carry the same
        # number, and a silent lie the moment they did not. A build cannot fail
        # on a wrong-but-valid version, so assert it against the single source.
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $expected = (@($props.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $expected) { throw 'No <Version> found in Directory.Build.props' }

          $reported = (& ./artifacts/cli/lumendeck-cli.exe --version).Trim()
          if ($reported -ne $expected) {
            throw "lumendeck-cli --version says '$reported'; Directory.Build.props says '$expected'"
          }

          foreach ($exe in 'artifacts/gui/LumenDeck.exe', 'artifacts/cli/lumendeck-cli.exe') {
            $fv = (Get-Item $exe).VersionInfo.FileVersion
            if ($fv -ne "$expected.0") { throw "$exe reports file version $fv, expected $expected.0" }
          }
          Write-Host "version $expected agrees across --version and both executables"

      - uses: actions/upload-artifact@v4
        with:
          name: lumendeck-win-x64
          path: |
            artifacts/gui/LumenDeck.exe
            artifacts/cli/lumendeck-cli.exe
